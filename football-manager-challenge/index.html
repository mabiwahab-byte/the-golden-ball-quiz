<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Manager Challenge</title>
<style>
:root{--bg:#07130f;--panel:#10231b;--panel2:#173328;--green:#8df0a7;--muted:#a8bdb0;--line:#294638;--gold:#ffd36b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173d2b 0,#07130f 48%);color:#f4fff7;font:15px/1.45 system-ui,Arial}button,select{font:inherit}button{cursor:pointer;border:1px solid #427256;background:#1d5438;color:white;border-radius:10px;padding:10px 14px;font-weight:700}button:hover{filter:brightness(1.15)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--green);color:#082014;border:0}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--green)}.tag{color:var(--muted);font-size:12px}.panel{background:linear-gradient(145deg,#142c21,#0d1d16);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 35px #0004}.hero{margin:35px auto;max-width:800px;text-align:center;padding:35px}.hero h1{font-size:clamp(30px,6vw,54px);line-height:1.05;margin:12px}.hero p{color:var(--muted)}.clubs,.stats,.nav,.grid{display:grid;gap:12px}.clubs{grid-template-columns:repeat(auto-fit,minmax(145px,1fr));margin-top:20px}.club{padding:18px 10px;background:#12291e;border:1px solid var(--line);border-radius:13px;color:white}.club b{display:block;font-size:16px}.club small{color:var(--muted)}.nav{grid-template-columns:repeat(5,1fr);margin:20px 0}.nav button{background:#10251b}.nav button.active{background:var(--green);color:#082014;border-color:var(--green)}.stats{grid-template-columns:repeat(4,1fr);margin:16px 0}.stat strong{display:block;font-size:25px;color:var(--green)}.stat small{color:var(--muted)}.grid{grid-template-columns:1.2fr .8fr}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h2{margin:0 0 12px;font-size:21px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.rating{color:var(--gold);font-weight:800}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.pill{font-size:11px;border:1px solid #41644f;border-radius:30px;padding:3px 8px;color:var(--green)}.pitch{background:repeating-linear-gradient(0deg,#17613a 0 52px,#1a6c40 52px 104px);border:4px solid #b4e3b8;border-radius:12px;padding:18px;display:grid;gap:15px;min-height:290px}.pitchrow{display:flex;justify-content:space-around;gap:6px}.playerdot{background:#f0fff2;color:#14301e;border-radius:9px;padding:7px 5px;text-align:center;min-width:54px;font-size:11px;font-weight:800}.playerdot small{display:block;font-weight:500}.notice{color:var(--gold);min-height:24px;margin-top:10px}.hidden{display:none}.empty{text-align:center;color:var(--muted);padding:25px}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.nav{grid-template-columns:repeat(3,1fr)}.wrap{padding:13px}.hero{padding:20px 8px}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">⚽ FOOTBALL <span>MANAGER</span> CHALLENGE</div><div class="tag">BUILD YOUR CLUB. MAKE HISTORY.</div></div><div id="clubBadge" class="pill">No club selected</div></header>
<div id="choose" class="panel hero"><div class="pill">NEW CAREER</div><h1>YOUR CLUB. YOUR <span style="color:var(--green)">LEGACY.</span></h1><p>Pick a club, shape your squad, make smart transfers and chase trophies.</p><h2>Choose your club</h2><div id="clubs" class="clubs"></div></div>
<div id="game" class="hidden"><div class="stats"><div class="panel stat"><small>LEAGUE POSITION</small><strong id="position">1st</strong></div><div class="panel stat"><small>POINTS</small><strong id="points">0</strong></div><div class="panel stat"><small>TRANSFER BUDGET</small><strong id="budget">$80m</strong></div><div class="panel stat"><small>MANAGER RATING</small><strong id="manager">A</strong></div></div>
<nav class="nav"><button data-page="overview" class="active">Overview</button><button data-page="squad">Squad</button><button data-page="transfers">Transfers</button><button data-page="fixtures">Fixtures</button><button data-page="table">League</button></nav>
<div id="page"></div><div id="notice" class="notice"></div></div></div>
<script>
const clubList=[["Liverpool","LIV","Premier League"],["Arsenal","ARS","Premier League"],["Manchester City","MCI","Premier League"],["Chelsea","CHE","Premier League"],["Real Madrid","RMA","La Liga"],["Barcelona","BAR","La Liga"],["Bayern Munich","BAY","Bundesliga"],["Paris Saint-Germain","PSG","Ligue 1"],["Inter","INT","Serie A"],["AC Milan","MIL","Serie A"],["Borussia Dortmund","BVB","Bundesliga"],["Tottenham","TOT","Premier League"]];
const pool=[["Alex Morgan","GK",82,27,8],["Jamie Carter","DEF",80,25,16],["Leo Silva","DEF",84,24,24],["Noah Williams","DEF",78,28,10],["Daniel Costa","DEF",81,26,18],["Ethan Brooks","MID",85,23,35],["Mateo Rossi","MID",83,27,29],["Samir Khan","MID",79,22,20],["Lucas Martin","ATT",88,25,55],["Kai Thompson","ATT",86,24,48],["Rafael Santos","ATT",84,29,32],["Oliver Reed","GK",74,21,4],["Ben Walker","DEF",75,22,7],["Hugo Moreau","MID",77,23,12],["Tariq Ali","ATT",78,21,14],["Marco Bellini","MID",81,26,22],["Andre Costa","ATT",82,24,26],["Felix Meyer","DEF",79,25,15]];
const opponents=["Northbridge FC","Capital United","Royal Athletic","Harbour Town","Redwood City","Kingsport","Eastvale","Westford"];
let state=null;const $=id=>document.getElementById(id);const money=n=>"$"+n+"m";function save(){localStorage.setItem("fmc-save",JSON.stringify(state))}function load(){try{state=JSON.parse(localStorage.getItem("fmc-save"))}catch{}if(state)showGame()}
function start(c){state={club:c[0],badge:c[1],league:c[2],budget:80,played:0,points:0,wins:0,draws:0,losses:0,formation:"4-3-3",squad:pool.slice(0,11).map((p,i)=>({...p,id:i,starter:true})).concat(pool.slice(11,14).map((p,i)=>({...p,id:i+11,starter:false}))),fixtures:opponents.map((o,i)=>({op:o,done:false,home:i%2===0,score:null}))};save();showGame()}
function showGame(){$("choose").classList.add("hidden");$("game").classList.remove("hidden");$("clubBadge").textContent=state.badge+" · "+state.club;stats();render("overview")}
function stats(){$("points").textContent=state.points;$("budget").textContent=money(state.budget);$("position").textContent=state.played?Math.max(1,Math.min(8,8-Math.floor(state.points/4)))+"th":"—";$("manager").textContent=state.wins>=5?"A+":state.wins>=2?"A":"B"}
function notify(t){$("notice").textContent=t}
function render(page){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let p=$("page");if(page==="overview"){p.innerHTML=`<div class="grid"><section class="panel"><div class="sectionhead"><h2>Manager's Office</h2><span class="pill">Season 1</span></div><h1>Welcome to ${state.club}</h1><p class="muted">The board wants competitive football and a push for silverware. Your journey starts now.</p><div class="row"><span>Matches played</span><b>${state.played}/8</b></div><div class="row"><span>Record</span><b>${state.wins}W · ${state.draws}D · ${state.losses}L</b></div><div class="row"><span>Squad strength</span><b>${Math.round(state.squad.reduce((a,x)=>a+x[2],0)/state.squad.length)} avg</b></div></section><section class="panel"><h2>Next fixture</h2>${nextFixture()||'<p class="muted">Season completed!</p>'}<button class="primary" onclick="render('fixtures')">Go to fixtures</button></section></div><div class="panel" style="margin-top:14px"><h2>Quick actions</h2><button onclick="render('squad')">Set up my squad</button> <button onclick="render('transfers')">Explore transfers</button></div>`;}
if(page==="squad"){let rows=state.squad.map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td class="rating">${x[2]}</td><td>${money(x[4])}</td><td><button onclick="toggleStarter(${i})">${x.starter?'Starting XI':'Bench'}</button></td></tr>`).join("");p.innerHTML=`<div class="panel"><div class="sectionhead"><h2>First Team Squad</h2><select id="formation" onchange="setFormation(this.value)"><option>4-3-3</option><option>4-2-4</option><option>4-4-2</option><option>3-5-2</option><option>4-2-3-1</option></select></div><div class="pitch" id="pitch">${pitchHTML()}</div><table><thead><tr><th>Player</th><th>Pos</th><th>OVR</th><th>Value</th><th>Role</th></tr></thead><tbody>${rows}</tbody></table><p class="muted">Choose 11 starters. Formation layout is a tactical display.</p></div>`;$("formation").value=state.formation}
if(page==="transfers"){let available=pool.filter(x=>!state.squad.some(y=>y[0]===x[0])).map((x,i)=>`<div class="row"><div><b>${x[0]}</b><div class="muted">${x[1]} · OVR ${x[2]} · ${money(x[4])}</div></div><button onclick="buy('${x[0]}')">Sign</button></div>`).join("");p.innerHTML=`<div class="panel"><div class="sectionhead"><h2>Transfer Market</h2><span class="pill">Budget ${money(state.budget)}</span></div>${available||'<p class="empty">No more players available in this market.</p>'}</div><div class="panel" style="margin-top:14px"><h2>Sell a player</h2>${state.squad.map(x=>`<div class="row"><span>${x[0]} · ${money(x[4])}</span><button onclick="sell('${x[0]}')">Sell</button></div>`).join("")}</div>`;}
if(page==="fixtures"){p.innerHTML=`<div class="panel"><h2>Season Fixtures</h2>${state.fixtures.map((f,i)=>`<div class="row"><div><b>${f.home?state.club+' vs '+f.op:f.op+' vs '+state.club}</b><div class="muted">Matchday ${i+1}</div></div>${f.done?'<b class="rating">'+f.score+'</b>':'<button class="primary" onclick="play('+i+')">Play match</button>'}</div>`).join("")}</div>`;}
if(page==="table"){let entries=[[state.club,state.points,state.wins,state.draws,state.losses]];for(let i=0;i<7;i++)entries.push([opponents[i],Math.max(0,18-i*2+Math.floor(state.played*(i%3-1))),5-i%4,2,1+i%3]);entries.sort((a,b)=>b[1]-a[1]);p.innerHTML=`<div class="panel"><h2>${state.league} — League Table</h2><table><thead><tr><th>#</th><th>Club</th><th>Pts</th><th>W</th><th>D</th><th>L</th></tr></thead><tbody>${entries.map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td><b>${x[1]}</b></td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join("")}</tbody></table></div>`;}}
function nextFixture(){let i=state.fixtures.findIndex(f=>!f.done);if(i<0)return null;let f=state.fixtures[i];return `<h3>${f.home?state.club+' vs '+f.op:f.op+' vs '+state.club}</h3><p class="muted">Matchday ${i+1} · ${f.home?'Home':'Away'}</p>`}
function pitchHTML(){let nums=state.formation.split("-").map(Number),starters=state.squad.filter(x=>x.starter).slice(0,11),idx=0,rows=[];let order=[1,...nums.slice().reverse()];order.forEach(n=>{let cells=[];for(let j=0;j<n&&idx<starters.length;j++){let x=starters[idx++];cells.push(`<div class="playerdot">${x[0].split(" ").slice(-1)[0]}<small>${x[1]} · ${x[2]}</small></div>`)}rows.push('<div class="pitchrow">'+cells.join("")+'</div>')});return rows.join("")}
function toggleStarter(i){let x=state.squad[i];if(x.starter){if(state.squad.filter(a=>a.starter).length<=11)return notify("Keep at least 11 players starting.");x.starter=false}else{if(state.squad.filter(a=>a.starter).length>=11)return notify("Choose a starter to move to the bench first.");x.starter=true}save();render("squad")}
function setFormation(v){state.formation=v;save();render("squad");notify("Formation changed to "+v)}
function buy(name){let x=pool.find(a=>a[0]===name);if(state.budget<x[4])return notify("Not enough budget for that transfer.");state.budget-=x[4];state.squad.push({...x,id:Date.now(),starter:false});save();stats();render("transfers");notify(name+" signed!")}
function sell(name){if(state.squad.filter(x=>x.starter).length<=11&&state.squad.find(x=>x[0]===name).starter)return notify("You need at least 11 starters.");let i=state.squad.findIndex(x=>x[0]===name);let x=state.squad.splice(i,1)[0];state.budget+=Math.max(1,Math.floor(x[4]*.8));save();stats();render("transfers");notify(name+" sold.")}
function play(i){i=Number(i);let f=state.fixtures[i];if(f.done)return;let strength=state.squad.filter(x=>x.starter).reduce((a,x)=>a+x[2],0)/11;let a=Math.max(0,Math.floor(Math.random()*3+(strength-80)/8+(f.home?.5:0))),b=Math.max(0,Math.floor(Math.random()*3+(82-strength)/9+(!f.home?.5:0)));let us=f.home?a:b,them=f.home?b:a;f.score=f.home?us+"-"+them:them+"-"+us;f.done=true;state.played++;if(us>them){state.points+=3;state.wins++}else if(us===them){state.points++;state.draws++}else state.losses++;save();stats();render("fixtures");notify("Full time: "+f.score+" — "+(us>them?"Victory!":us===them?"A draw.":"Defeat."))}
$("clubs").innerHTML=clubList.map(c=>`<button class="club" onclick='start(${JSON.stringify(c)})'><b>⚽ ${c[0]}</b><small>${c[2]}</small></button>`).join("");document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.page)));load();
</script></body></html>
