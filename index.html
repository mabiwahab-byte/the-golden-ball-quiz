(function(){let pending=null;const button=document.getElementById('installApp'),help=document.getElementById('installHelp');const say=t=>{help.textContent=t;};const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;if(standalone()){button.textContent='✓ App installed';button.disabled=true;}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pending=e;});button.addEventListener('click',async()=>{if(standalone()){say('The Golden Ball Quiz is already installed on this device.');return;}if(pending){pending.prompt();const result=await pending.userChoice;say(result.outcome==='accepted'?'Installation accepted! Find the quiz in your apps or on your home screen.':'You can install it later using this button.');pending=null;return;}const ua=navigator.userAgent;if(/iphone|ipad|ipod/i.test(ua)){say('On iPhone/iPad: open this page in Safari, tap Share, choose “Add to Home Screen”, then tap Add.');}else if(/android/i.test(ua)){say('On Android: open the browser menu (⋮) and choose “Install app” or “Add to Home screen”.');}else{say('In Chrome or Edge, look for the install icon in the address bar, or open the browser menu and choose “Install The Golden Ball Quiz”.');}});window.addEventListener('appinstalled',()=>{button.textContent='✓ App installed';button.disabled=true;say('Installed! Find The Golden Ball Quiz in your apps.');});if('serviceWorker'in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}})();
